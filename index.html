<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mini Login — QAEverest Pilot</title>
<style>body{font-family:system-ui;padding:40px;max-width:480px}label{display:block;margin:12px 0 4px}input,button{width:100%;padding:10px;font-size:16px}button{margin-top:16px;background:#0969da;color:#fff;border:0;border-radius:6px} .msg{margin-top:16px;padding:12px;display:none} .msg.ok{background:#e6ffec;border:1px solid #a7e8b0} .msg.err{background:#ffebe9;border:1px solid #ffb3b3}
nav{margin-bottom:20px;color:#57606a;font-size:14px}
</style></head>
<body>
<nav>QAEverest Pilot — baseline v1 • <span id="build">build: M8-element-removed</span></nav>
<h1>Sign in</h1>
<form id="login">
  <label for="username">Username</label>
  <input id="username" name="username" placeholder="Username" autocomplete="username" />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" />
</form>
<div style="margin-top:16px;border-top:1px solid #ddd;padding-top:16px">
  <label for="username2">Username</label>
  <input id="username2" name="username2" placeholder="Username" autocomplete="username" />
  <label for="password2">Password</label>
  <input id="password2" name="password2" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="promoBtn" type="submit">Sign in</button>
</div>
<div id="ok" class="msg ok">Welcome, <span id="who"></span>!</div>
<div id="err" class="msg err">Invalid credentials</div>
<script>
const form=document.getElementById('login'), ok=document.getElementById('ok'), err=document.getElementById('err'), who=document.getElementById('who');
form.addEventListener('submit',e=>{
  e.preventDefault();
  const u=document.getElementById('username').value.trim(), p=document.getElementById('password').value.trim();
  ok.style.display='none'; err.style.display='none';
  if(u==='alice' && p==='alice123'){ who.textContent=u; ok.style.display='block'; }
  else err.style.display='block';
});
</script>
</body>
</html>
